name: Solid Memory tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: |
          python -m solid_memory --db /tmp/solid-memory-ci.sqlite3 add "CI smoke test" --type CLAIM
          python -m solid_memory --db /tmp/solid-memory-ci.sqlite3 verify
